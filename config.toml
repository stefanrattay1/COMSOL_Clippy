# COMSOL Clippy configuration. All paths are relative to this file's directory
# unless absolute. Edit and re-run setup / `main.py ingest` to apply.

[embedding]
model = "Alibaba-NLP/gte-Qwen2-1.5B-instruct"
dim = 1536
max_seq_tokens = 8192          # model supports 32k; capped for memory/speed
batch_size = 8                 # auto-halves on OOM (CUDA or CPU) down to 1
# How queries are formatted before embedding:
#   "qwen-instruct" -> wrap as "Instruct: <task>\nQuery: <q>" (for gte-Qwen2 instruct models)
#   "none"          -> embed the raw query (for non-instruct models)
instruction_format = "qwen-instruct"
# Task description used for the query instruction prefix (documents get none).
# Only used when instruction_format = "qwen-instruct".
query_instruction = "Given a question about COMSOL Multiphysics, retrieve relevant passages from the user manuals that answer it"
# Bounded LRU cache of query-text -> embedding vector in the long-lived daemon, so a
# repeated/iterated question skips re-running the model. 0 disables caching.
cache_size = 256

[chunking]
chunk_tokens = 512
chunk_overlap_tokens = 64
min_chunk_tokens = 64

[paths]
source_dir = "source"          # input PDFs
data_dir = "data"              # holds chroma/ and manifest.json
chroma_subdir = "chroma"
manifest_name = "manifest.json"

[store]
collection = "comsol_docs"

[search]
# Drop hits whose relevance (1 - cosine distance, clamped to [0,1]) is below this
# floor. 0.0 keeps current behaviour (always return top_k); raise it so off-topic
# questions get an honest "no relevant passages" instead of weak matches.
min_relevance = 0.0
