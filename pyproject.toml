[project]
name = "comsol-clippy"
version = "0.1.0"
description = "Local RAG vectorstore + MCP server over COMSOL manuals (gte-Qwen2-1.5B-instruct + ChromaDB)"
requires-python = ">=3.10"
dependencies = [
    # torch is installed separately by the setup scripts (CUDA wheel in WSL, CPU on Windows).
    # transformers/sentence-transformers are pinned to versions compatible with torch 2.5.x:
    # newer releases reference torch.float8_e8m0fnu (torch >=2.7) and fail to import.
    "sentence-transformers>=3.0,<3.4",
    "transformers>=4.44,<4.46",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "mcp>=1.2",
    "typer>=0.12",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
# Lightweight dev deps for the pure-logic tests + linting. These intentionally do
# NOT pull torch / chromadb / sentence-transformers: the test suite imports only
# stdlib-backed modules, so `pip install -e ".[dev]"` stays fast (and matches CI).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
comsol-clippy = "comsol_clippy.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["comsol_clippy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# 110 clears the longest existing line (108) so the linter doesn't churn clean code.
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (F) + a pragmatic slice of pycodestyle (E). Keep it quiet on the
# existing style; expand later if desired.
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is enforced by the formatter setting above, not as a lint error
