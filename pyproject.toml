[project]
name = "comsol-clippy"
version = "0.1.0"
description = "Local RAG vectorstore + MCP server over COMSOL manuals (Qwen3-VL-Embedding-2B + ChromaDB)"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # torch is installed separately by the setup scripts (CUDA wheel in WSL, CPU on Windows).
    # Qwen3-VL-Embedding-2B needs the newer multimodal stack:
    #   - transformers >=5.2: the checkpoint stores its weights under a `model.` prefix
    #     that transformers 4.x's Qwen3VLModel does NOT map, so 4.x silently RANDOM-INITS
    #     the whole network (embeddings become noise). 5.2+ loads the weights correctly.
    #   - transformers 5.x imports torch.float8_e8m0fnu, which only exists in torch >=2.7,
    #     so the setup scripts must install torch >=2.7 (we verified torch 2.8.0). torch 2.5.x
    #     can't even import transformers 5.
    #   - torchvision is a HARD dependency: the model's processor pulls in AutoVideoProcessor
    #     (requires torchvision) even for text-only use, so loading fails without it.
    "sentence-transformers>=5.4,<6",
    "transformers>=5.2,<6",
    "torchvision>=0.22",
    "qwen-vl-utils>=0.0.14,<1",
    # Conservative upper bounds guard against a surprise major break; they're set
    # above the versions currently in use (chromadb 1.x, pymupdf/mcp 1.x, typer 0.x).
    "chromadb>=0.5,<2",
    "pymupdf>=1.24,<2",
    "mcp>=1.2,<2",
    "typer>=0.12,<1",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/stefanrattay1/COMSOL_Clippy"

[project.optional-dependencies]
# Lightweight dev deps for the pure-logic tests + linting. These intentionally do
# NOT pull torch / chromadb / sentence-transformers: the test suite imports only
# stdlib-backed modules, so `pip install -e ".[dev]"` stays fast (and matches CI).
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
workflow = [
    "mph>=1.3,<2",
]

[project.scripts]
comsol-clippy = "comsol_clippy.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["comsol_clippy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deselect integration tests by default so the bare `pytest` that CI runs (with
# only pytest+ruff installed) stays fast and heavy-dep-free. Run them explicitly
# with `pytest -m integration` in an environment that has chromadb (and, for the
# model-backed ones, torch + the embedding model) installed.
addopts = "-q -m 'not integration'"
markers = [
    "integration: exercises the real heavy deps (chromadb / torch / the embedding model); opt-in",
]

[tool.ruff]
# 110 clears the longest existing line (108) so the linter doesn't churn clean code.
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# Pyflakes (F) + a pragmatic slice of pycodestyle (E). Keep it quiet on the
# existing style; expand later if desired.
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is enforced by the formatter setting above, not as a lint error
